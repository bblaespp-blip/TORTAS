<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repostería - Arma tu Pastel</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Fuentes e Íconos -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Encabezado -->
  <header class="header">
    <h1>🎂 Repostería Mágica</h1>
    <p>¡Diseña tu pastel ideal y haz tu pedido en vivo!</p>
  </header>

  <main class="main-container">
    
    <!-- ÁREA DEL MINIJUEGO / PREVISUALIZADOR -->
    <section class="preview-section">
      <div class="card">
        <h2>Vista Previa de tu Pastel</h2>
        <div class="stage" id="stage">
          <!-- Stand / Plato -->
          <div class="plate"></div>

          <!-- Capas dinámicas dibujadas con JS -->
          <div id="cake-layers" class="cake-container"></div>
        </div>

        <!-- Resumen de Costo -->
        <div class="price-box">
          <span>Total Estimado:</span>
          <strong id="total-price">$0</strong>
        </div>
      </div>
    </section>

    <!-- PANEL DE PERSONALIZACIÓN -->
    <section class="controls-section">
      <div class="card">
        <h2>Personaliza tu Pedido</h2>
        
        <form id="cake-form" onsubmit="event.preventDefault();">
          
          <!-- Paso 1: Tamaño (Medidas) -->
          <div class="form-group">
            <label>1. Tamaño del Pastel:</label>
            <div class="btn-grid" id="size-selector">
              <button type="button" class="btn-option active" data-size="media" data-multiplier="0.75">Media Libra</button>
              <button type="button" class="btn-option" data-size="libra" data-multiplier="1">1 Libra</button>
              <button type="button" class="btn-option" data-size="tres-cuartos" data-multiplier="1.5">Tres Cuartos</button>
            </div>
          </div>

          <!-- Paso 2: Tipo de Torta y Cobertura -->
          <div class="form-group">
            <label>2. Tipo de Torta y Cobertura:</label>
            <select id="type-select" class="input-control">
              <optgroup label="❄️ Tortas Frías">
                <option value="fria-crema" data-price-extra="0" data-category="Fría">Crema Fría / Chantilly</option>
                <option value="fria-ganache" data-price-extra="3000" data-category="Fría">Ganache de Chocolate (+$3,000)</option>
              </optgroup>
              <optgroup label="🔥 Tortas Tradicionales / Calientes">
                <option value="caliente-mantequilla" data-price-extra="0" data-category="Tradicional">Crema de Mantequilla (Buttercream)</option>
                <option value="caliente-arequipe" data-price-extra="2000" data-category="Tradicional">Arequipe (+$2,000)</option>
                <option value="caliente-queso" data-price-extra="3000" data-category="Tradicional">Crema de Queso (+$3,000)</option>
                <option value="caliente-merengue" data-price-extra="1000" data-category="Tradicional">Merengue (+$1,000)</option>
              </optgroup>
            </select>
          </div>

          <!-- Paso 3: Sabor del Bizcocho -->
          <div class="form-group">
            <label>3. Sabor del Bizcocho:</label>
            <select id="flavour-select" class="input-control">
              <option value="vainilla" data-price="25000">Vainilla Tradicional ($25,000)</option>
              <option value="chocolate" data-price="28000">Chocolate ($28,000)</option>
              <option value="naranja" data-price="26000">Naranja ($26,000)</option>
              <option value="redvelvet" data-price="32000">Red Velvet ($32,000)</option>
            </select>
          </div>

          <!-- Paso 4: Color de la Crema -->
          <div class="form-group">
            <label>4. Color de la Crema / Decoración:</label>
            <div class="color-picker-grid">
              <button type="button" class="color-btn active" data-color="#FFF8DC" title="Blanco Cream" style="background:#FFF8DC;"></button>
              <button type="button" class="color-btn" data-color="#5C3A21" title="Chocolate" style="background:#5C3A21;"></button>
              <button type="button" class="color-btn" data-color="#FFB6C1" title="Rosado Fresa" style="background:#FFB6C1;"></button>
              <button type="button" class="color-btn" data-color="#B0E0E6" title="Azul Celeste" style="background:#B0E0E6;"></button>
              <button type="button" class="color-btn" data-color="#FFFACD" title="Amarillo Pastel" style="background:#FFFACD;"></button>
              <button type="button" class="color-btn" data-color="#C1E1C1" title="Verde Menta" style="background:#C1E1C1;"></button>
              <button type="button" class="color-btn" data-color="#E6E6FA" title="Lavanda" style="background:#E6E6FA;"></button>
            </div>
          </div>

          <!-- Paso 5: Toppings y Extras -->
          <div class="form-group">
            <label>5. Toppings y Extras (Opcionales):</label>
            <div class="checkbox-grid">
              <label class="check-card">
                <input type="checkbox" value="Chispas de colores" data-price="3000" class="topping-check">
                <span>✨ Chispas de colores (+$3,000)</span>
              </label>
              <label class="check-card">
                <input type="checkbox" value="Chispas de chocolate" data-price="3000" class="topping-check">
                <span>🍫 Chispas de chocolate (+$3,000)</span>
              </label>
              <label class="check-card">
                <input type="checkbox" value="Masmelos" data-price="4000" class="topping-check">
                <span>🍡 Masmelos (+$4,000)</span>
              </label>
              <label class="check-card">
                <input type="checkbox" value="Chocolate chorreado" data-price="5000" class="topping-check">
                <span>🍫 Extra Chocolate Chorreado (+$5,000)</span>
              </label>
            </div>
          </div>

          <!-- Paso 6: Mensaje -->
          <div class="form-group">
            <label for="custom-text">6. Mensaje en el Pastel (Opcional):</label>
            <input type="text" id="custom-text" class="input-control" placeholder="Ej: ¡Feliz Cumpleaños!" maxlength="30">
          </div>

          <!-- Botón de Pedido -->
          <button type="button" id="whatsapp-btn" class="btn-whatsapp">
            📲 Enviar Pedido por WhatsApp
          </button>

        </form>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
