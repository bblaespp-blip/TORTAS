<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Repostería - Santa Marta</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Fuentes e Íconos -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Encabezado -->
  <header class="header">
    <h1>🍰 Tu Repostería</h1>
    <p>¡Diseña tu pastel ideal en Santa Marta y haz tu pedido en vivo!</p>
  </header>

  <main class="main-container">
    
    <!-- ÁREA DEL MINIJUEGO / PREVISUALIZADOR -->
    <section class="preview-section">
      <div class="card">
        <h2>Vista Previa de tu Pastel</h2>
        <div class="stage" id="stage">
          <!-- Stand / Plato -->
          <div class="plate"></div>

          <!-- Capa dinámica de la torta realista -->
          <div id="cake-layers" class="cake-container"></div>
        </div>

        <!-- Resumen de Costo -->
        <div class="price-box">
          <span>Total Estimado:</span>
          <strong id="total-price">$0</strong>
        </div>
      </div>
    </section>

    <!-- PANEL DE PERSONALIZACIÓN -->
    <section class="controls-section">
      <div class="card">
        <h2>Personaliza tu Pedido</h2>
        
        <form id="cake-form" onsubmit="event.preventDefault();">
          
          <!-- Paso 1: Tamaño (Medidas) -->
          <div class="form-group">
            <label>1. Tamaño del Pastel:</label>
            <div class="btn-grid" id="size-selector">
              <button type="button" class="btn-option active" data-size="media" data-multiplier="1">Media Libra</button>
              <button type="button" class="btn-option" data-size="tres-cuartos" data-multiplier="1.4">Tres Cuartos</button>
              <button type="button" class="btn-option" data-size="libra" data-multiplier="1.8">1 Libra</button>
            </div>
          </div>

          <!-- Paso 2: Tipo de Torta y Cobertura -->
          <div class="form-group">
            <label>2. Tipo de Torta y Cobertura:</label>
            <select id="type-select" class="input-control">
              <optgroup label="❄️ Tortas Frías">
                <option value="fria-crema" data-price-extra="0" data-category="Fría">Crema Fría / Chantilly</option>
                <option value="fria-ganache" data-price-extra="5000" data-category="Fría">Ganache de Chocolate (+$5,000)</option>
              </optgroup>
              <optgroup label="🔥 Tortas Tradicionales / Calientes">
                <option value="caliente-mantequilla" data-price-extra="0" data-category="Tradicional">Crema de Mantequilla (Buttercream)</option>
                <option value="caliente-arequipe" data-price-extra="4000" data-category="Tradicional">Arequipe (+$4,000)</option>
                <option value="caliente-queso" data-price-extra="6000" data-category="Tradicional">Crema de Queso (+$6,000)</option>
                <option value="caliente-merengue" data-price-extra="3000" data-category="Tradicional">Merengue (+$3,000)</option>
              </optgroup>
            </select>
          </div>

          <!-- Paso 3: Sabor del Bizcocho -->
          <div class="form-group">
            <label>3. Sabor del Bizcocho:</label>
            <select id="flavour-select" class="input-control">
              <option value="vainilla" data-price="35000">Vainilla Tradicional ($35,000)</option>
              <option value="chocolate" data-price="38000">Chocolate ($38,000)</option>
              <option value="naranja" data-price="36000">Naranja ($36,000)</option>
              <option value="redvelvet" data-price="42000">Red Velvet ($42,000)</option>
            </select>
          </div>

          <!-- Paso 4: Color de la Crema y Combinados -->
          <div class="form-group">
            <label>4. Color de la Crema (Sólidos y Combinados):</label>
            <div class="color-picker-grid">
              <!-- Colores Sólidos -->
              <button type="button" class="color-btn active" data-color="#FFF8DC" title="Blanco Crema" style="background:#FFF8DC;"></button>
              <button type="button" class="color-btn" data-color="#FFE4E1" title="Rosa Pastel" style="background:#FFE4E1;"></button>
              <button type="button" class="color-btn" data-color="#FF69B4" title="Rosado Fucsia" style="background:#FF69B4;"></button>
              <button type="button" class="color-btn" data-color="#FFDAB9" title="Durazno" style="background:#FFDAB9;"></button>
              <button type="button" class="color-btn" data-color="#FFFACD" title="Amarillo Vainilla" style="background:#FFFACD;"></button>
              <button type="button" class="color-btn" data-color="#C1E1C1" title="Verde Menta" style="background:#C1E1C1;"></button>
              <button type="button" class="color-btn" data-color="#B0E0E6" title="Azul Celeste" style="background:#B0E0E6;"></button>
              <button type="button" class="color-btn" data-color="#E6E6FA" title="Lavanda" style="background:#E6E6FA;"></button>
              <button type="button" class="color-btn" data-color="#5C3A21" title="Chocolate" style="background:#5C3A21;"></button>

              <!-- Colores Combinados / Degradados -->
              <button type="button" class="color-btn" data-gradient="linear-gradient(135deg, #FFB6C1, #FFF8DC)" title="Combinado: Rosa & Vainilla" style="background: linear-gradient(135deg, #FFB6C1, #FFF8DC);"></button>
              <button type="button" class="color-btn" data-gradient="linear-gradient(135deg, #B0E0E6, #FFF8DC)" title="Combinado: Celeste & Vainilla" style="background: linear-gradient(135deg, #B0E0E6, #FFF8DC);"></button>
              <button type="button" class="color-btn" data-gradient="linear-gradient(135deg, #E6E6FA, #FFB6C1)" title="Combinado: Lila & Rosa" style="background: linear-gradient(135deg, #E6E6FA, #FFB6C1);"></button>
              <button type="button" class="color-btn" data-gradient="linear-gradient(135deg, #C1E1C1, #FFFACD)" title="Combinado: Menta & Amarillo" style="background: linear-gradient(135deg, #C1E1C1, #FFFACD);"></button>
            </div>
          </div>

          <!-- Paso 5: Toppings -->
          <div class="form-group">
            <label>5. Toppings y Decoraciones:</label>
            <div class="checkbox-grid">
              <label class="check-card">
                <input type="checkbox" value="Chispas de colores" data-price="3000" class="topping-check">
                <span>✨ Chispas de colores (+$3,000)</span>
              </label>
              <label class="check-card">
                <input type="checkbox" value="Chispas de chocolate" data-price="3000" class="topping-check">
                <span>🍫 Chispas de chocolate (+$3,000)</span>
              </label>
              <label class="check-card">
                <input type="checkbox" value="Masmelos" data-price="4000" class="topping-check">
                <span>🍡 Masmelos (+$4,000)</span>
              </label>
              <label class="check-card">
                <input type="checkbox" value="Chocolate chorreado" data-price="5000" class="topping-check">
                <span>🍩 Chocolate chorreado (+$5,000)</span>
              </label>
            </div>
          </div>

          <!-- Paso 6: Mensaje -->
          <div class="form-group">
            <label for="custom-text">6. Mensaje en el Pastel (Opcional):</label>
            <input type="text" id="custom-text" class="input-control" placeholder="Ej: ¡Feliz Cumpleaños!" maxlength="30">
          </div>

          <!-- Botón de Pedido -->
          <button type="button" id="whatsapp-btn" class="btn-whatsapp">
            📲 Enviar Pedido por WhatsApp
          </button>

        </form>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
